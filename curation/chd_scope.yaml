      MONDO definition names "congenital heart disease, aortic valve disease
      including bicuspid aortic valve" among the entities lumped, records that
      "Adams-Oliver syndrome 5 and aortic valve disease 1 have been lumped into one
      disease entity", and MONDO files it under MONDO:0100614 syndromic congenital
      heart disease. Without it NOTCH1 published no page: its only in-scope record
      was Orphanet's "Supportive" for familial bicuspid aortic valve.
    admitted_by: clingen_expert_panel
    attributed_to: Hereditary Cardiovascular Disease Gene Curation Expert Panel
    admitted_on: 2026-10-25
