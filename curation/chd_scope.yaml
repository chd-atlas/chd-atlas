# What counts as congenital heart disease for this atlas.
#
# RULE (rewritten 2026-08-06): a term is in scope when an EXTERNAL authority
# already treats it as congenital heart disease. This atlas selects among terms
# other people scope; it does not scope any term itself.
#
# SECOND PATH (2026-10-25, issue #8 part 1): a syndrome where structural CHD is
# frequent but not part of the diagnosis -- Noonan, Costello, Adams-Oliver -- is
# in scope when a curator nominates it AND Orphanet records a structural heart
# phenotype for it at Frequent (79-30%) or stronger. `admitted_by:
# orphanet_phenotype_frequency`, with `orphanet:` naming the ORPHA code; SCP006
# checks the claim against the Orphanet and MONDO mirrors, and SCP007 lists the
# terms that would qualify but nobody nominated. The rule is in
# src/chd_atlas/orphanet_scope.py; the entries are grouped at the end of this
# file.
#
# Until 2026-08-06 every entry here named the project owner as the admitting
# authority, which made this atlas -- and one non-clinician -- the authority on
# what counts as CHD. It is not one, and no individual should appear in this
# field. `admitted_by` is now a closed vocabulary of external authorities
# (`models/scope.py::ScopeAuthority`), so a person's name cannot be entered, and
# `attributed_to` names the panel or submitter that uses the term. SCP005 checks
# both against the mirrors -- the name, and that the authority CLASS matches the
# mirror the name was found in -- so a commercial laboratory's term cannot be
# relabelled as a ClinGen panel's.
#
# `reason` survives and still says why the term is congenital heart disease. It
# is a transcription of the cited authority's position, never an argument made
# here.
#
# Measured 2026-10-25 across these 105 terms: 13 are used by ClinGen's
# Congenital Heart Disease GCEP, 11 by another ClinGen expert panel, 45 by a
# GenCC submitter, and 36 are admitted on Orphanet's frequencies. None is
# unattributable. (68 terms until 2026-10-25: 13, 10 and 45.)
#
# NINE TERMS ARE SCOPED ONLY BY A COMMERCIAL CLINICAL LABORATORY, and are kept
# rather than dropped. Clinical labs curate for test-panel inclusion, a more
# inclusive question than "is this congenital heart disease", so their terms are
# labelled rather than trusted silently -- a reader can see exactly which nine
# and decide. They were briefly dropped on 2026-08-06 and reinstated the same
# day, because adversarial review measured the cost that decision was documented
# as not having: dropping them takes 11 registered genes out of scope entirely
# (BMPR1A, TBX1, CFAP45, CFC1, ASB17, ANKRD11, MCTP2, CFAP53, DENND5B, DLC1,
# FGF10), and deletes 5 mirrored validity records from 3 PUBLISHED bundles --
# NKX2-5 loses an Ambry `Definitive` and a Labcorp `Strong` call for conotruncal
# heart malformations, GATA6 and NR2F2 lose three more. The publication gate
# does not move (23 genes at Definitive, 76 at Limited), which is why the loss
# was invisible in the figure first checked. Do not drop them again without
# re-measuring that cost.
#
# `syndrome: true` (owner decision 2026-10-26, R5) marks a term naming a
# syndrome -- a disease with a heart malformation among its features -- rather
# than heart disease itself, so a gene page can say a grade for it is a grade
# for the syndrome as a whole. Curated, because no field said it: "congenital
# heart disease with heterotaxy syndrome" carries the word and is CHD itself.
# Set on the nine ClinGen-scoped terms that the ten genes graded at their
# headline for a syndrome are graded for (Alagille, Holt-Oram, Kabuki 1 and 2,
# CHARGE, Ellis-van Creveld, Mowat-Wilson, TARP, and NR2F2-related multiple
# congenital anomalies/dysmorphic syndrome); an Orphanet-path term needs no
# mark, its warrant already says it. Absent means false.
#
# REVIEW STATUS (owner's standing rule, 2026-10-27; `models/review.py`). Where
# this atlas leaves a question about a term open rather than settling it, the
# term carries `review_status` -- `pending_review` (a question about the term
# left open for an expert: a conflict between the sources it rests on, or a
# clinical judgement) or `not_accessible` (a source the term rests on could
# not be read) -- and a `review_note` stating exactly what is unresolved, and
# nothing more. Never assert either side, never speculate, never drop the term.
# Both fields or neither: loading refuses one without the other. `scope.json`
# publishes both (`null` where absent); no page renders them, since the owner
# wants no speculation on a gene's card. The two terms marked today
# (MONDO:1010098, MONDO:1060150, owner's answer of 2026-10-27) are
# `pending_review` for a clinical judgement, not a source conflict: whether
# each names a syndrome, left open for clinical review. Their `syndrome` mark
# stays unset meanwhile.
#
# Neither mechanical rule works, which is why a selection exists at all:
# filtering by ClinGen expert panel drops TBX5, NOTCH1 and CHD7 (their curating
# panels are Syndromic Disorders, Hereditary Cardiovascular Disease and Hearing
# Loss), and no MONDO is_a closure means CHD -- see src/chd_atlas/models/scope.py.
# Labels are transcribed from the mirrors and checked by SCP002.
