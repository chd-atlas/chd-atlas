# The sample collections the burden mirror's rows draw on.
#
# WHY THIS FILE EXISTS: the atlas publishes per-study burden rows and computes no
# meta-statistic, because the CHD literature reuses cohorts and a pooled p-value
# would count the same children twice. But a reader looking at four rows will
# meta-analyse them in their head regardless. Naming the cohorts is what turns
# that from an invisible trap into a fact a page can state: two rows citing `ddd`
# share samples, and it says so.
#
# There is no `role` field. A collection is cases in one study and could be
# controls in another, so which it was is a property of the burden row -- the
# column it appears in -- not of the collection.
#
# A NOTE ON THE AUDAIN 2026 CASE COHORTS (PMID:42230622). Its cohort description
# reads: "CHD cases were mainly sequenced as part of an initiative from the
# German Competence Network for Congenital Heart Defects, the Deciphering
# Developmental Disorder (DDD) project and the University of Nottingham (UK)".
# The word "mainly" is load-bearing and the paper does not resolve it: the ethics
# statement additionally lists the University of Leuven, Belgium (B322201010111 /
# S52853), so some Belgian samples are very likely in the case set. The burden
# rows name the three collections the cohort description names and no more,
# because inventing a fourth from an ethics approval would be the atlas asserting
# something the study did not.
cohorts:
  - id: cnchd
    name: German Competence Network for Congenital Heart Defects
    description: >-
      National German registry and biobank for congenital heart disease, based in
      Berlin, which recruits patients from paediatric cardiology centres across
      Germany and holds the associated German Heart Registry consent. Named in
      PMID:42230622 as one of the three collections its CHD cases were drawn from.
    url: https://www.kompetenznetz-ahf.de/en/
  # Rewritten 2026-10-26 (owner decisions W4, W5). It named a plan ("the CHD
  # exome studies this atlas plans to curate"), which a reader cannot check and
  # which says nothing about the data. "more than one", not the draft's
  # "several": two are verified -- PMID:42230622 names DDD among its case
  # collections, and Sifrim et al. 2016 (Nat Genet, doi:10.1038/ng.3627) lists
  # "the Deciphering Developmental Disorders Study" among its authors -- and no
  # third was found. "only one study cited today names it" is held to the
  # mirror by `test_models_cohort.py`, so a second study citing `ddd` fails
  # there until this is reworded.
  #
  # The DECIPHER sentence, here and in `decipher`'s entry: DDD's own data
  # access page (https://www.ddduk.org/accessing-ddd-data/, read 2026-10-26)
  # says likely diagnostic variants "will be linked to individual patient
  # records in DECIPHER", publicly with HPO terms once the family has been
  # told. So DECIPHER's patient records include DDD participants, and a case
  # set drawn from DECIPHER may too. The registry holds them as two ids, which
  # `shared_cohorts` never linked until owner decision 2026-10-27 (I3).
  # "this atlas's cohort registry", not "this registry" (review, 2026-10-27):
  # the sentence renders in a gene page's cohort notes too, where no registry
  # is in sight.
  #
  # `overlaps_with` (I3, 2026-10-27). An author of PMID:34324492 -- a study by
  # an atlas author (`own_lab`), which names `decipher` -- answered that its
  # case set does, or likely does, include DDD participants: through DECIPHER,
  # as above, and through a collection in its S2 Table that is not a
  # registered cohort. PMID:42230622 names `ddd`. The two studies were two independent datasets
  # on every page; declared here, `shared_cohorts` links them and
  # `cohort_families` makes them one. The descriptions' last clause read "this atlas's cohort registry
  # records the two as separate collections and cannot see that overlap"
  # until the declaration made it false; it is dropped rather than reworded,
  # because a page carrying both studies now states the overlap in its own
  # notice (`pages._overlap_notice`), and the descriptions keep the reason.
  - id: ddd
    name: Deciphering Developmental Disorders (DDD)
    description: >-
      UK-wide study of children with severe undiagnosed developmental disorders,
      recruited through the NHS regional genetics services and sequenced at the
      Wellcome Sanger Institute. Cases are ascertained on developmental disorder
      rather than on heart disease, so its contribution is enriched for syndromic
      CHD. Individual-level data are under controlled access via the EGA. DDD
      contributed to more than one CHD exome study, which is the sample reuse the
      cohort columns exist to make visible; only one study cited today names it.
      DDD links its participants' likely diagnostic variants to their own patient
      records in DECIPHER, so DECIPHER's cases may include DDD participants.
    overlaps_with:
      - decipher
    url: https://www.ddduk.org/
  - id: nottingham
    name: University of Nottingham congenital heart disease collection
    description: >-
      Congenital heart disease cases recruited and sequenced at the University of
      Nottingham, UK, under East Midlands-Leicester Research Ethics Committee
      approval 6721. Named in PMID:42230622 as one of the three collections its
      CHD cases were drawn from.
    url: https://www.nottingham.ac.uk/life-sciences/
  - id: signature
    name: Signature Genomics / PerkinElmer diagnostic CNV series
    description: >-
      1,615 individuals with congenital heart disease ascertained through
      clinical diagnostic array testing, the largest single contributor to the
      CNV case set of PMID:34324492. Diagnostic ascertainment enriches for
      severe and syndromic presentations relative to a population series.
  - id: decipher
    name: DECIPHER
    description: >-
      1,221 CHD cases from the DECIPHER database of submitted patient
      genotype-phenotype data. Submitted by clinical genetics centres, so
      ascertained on a diagnostic question rather than on heart disease. The
      Deciphering Developmental Disorders study links its participants' likely
      diagnostic variants to their own patient records in DECIPHER, so these
      cases may include DDD participants.
    url: https://www.deciphergenomics.org/
    overlaps_with:
      - ddd
  - id: isca
    name: International Standards for Cytogenomic Arrays (ISCA)
    description: >-
      629 CHD cases from the ISCA consortium's shared clinical array data.
    url: https://clinicalgenome.org/
  # Owner decision 2026-10-26 (R12): the seven case sources PMID:34324492's S2
  # Table identifies by PMID and credits with 50 or more cases, 1,969 in all,
  # registered so that a study curated later which names one of these series
  # is seen to share people with PMID:34324492 (`shared_cohorts`). Read from
  # the supplement's `s007.xlsx` (sheet "S2 Table") on 2026-10-27.
  #
  # Each description states what S2 states of the series -- its case count,
  # its phenotype (CHD for all seven) and its platform, quoted -- and that S2
  # lists it, and nothing else: no claim about the series was checked against
  # the paper S2 cites for it. S2's notes column is blank for all seven, so
  # S2 suggests no overlap between one of them and another registered cohort,
  # and none is declared. No url: a series has no home page of its own, and
  # the cohort list's link reads "website". The ids are the cited PMIDs; the
  # one S2 cites under two PMIDs carries both.
  - id: pmid22318994_cases
    name: CHD case series of PMID:22318994
    description: >-
      742 individuals with congenital heart disease, listed in PMID:34324492's
      S2 Table as a source of its CNV case set; S2 gives the platform as
      Affymetrix Array 6.0.
  - id: pmid22939634_cases
    name: CHD case series of PMID:22939634
    description: >-
      432 individuals with congenital heart disease, listed in PMID:34324492's
      S2 Table as a source of its CNV case set; S2 gives the platform as
      Affymetrix 6.0 array, Agilent CGH 44k/105K.
  - id: pmid22912587_cases
    name: CHD case series of PMID:22912587
    description: >-
      340 individuals with congenital heart disease, listed in PMID:34324492's
      S2 Table as a source of its CNV case set; S2 gives the platform as
      Affymetrix Array 6.0.
  - id: pmid22969434_cases
    name: CHD case series of PMID:22969434
    description: >-
      178 individuals with congenital heart disease, listed in PMID:34324492's
      S2 Table as a source of its CNV case set; S2 gives the platform as
      Affymetrix Array 6.0.
  - id: pmid22929023_cases
    name: CHD case series of PMID:22929023
    description: >-
      123 individuals with congenital heart disease, listed in PMID:34324492's
      S2 Table as a source of its CNV case set; S2 gives the platform as CGH
      array, Agilent CGH 44k/105k/180k oligo array.
  - id: pmid26655555_cases
    name: CHD case series of PMID:26655555
    description: >-
      91 individuals with congenital heart disease, listed in PMID:34324492's
      S2 Table as a source of its CNV case set and cited there as Table S2 of
      PMID:26655555; S2 gives the platform as Affymetrix Array 6.0.
  - id: pmid18535492_22349727_cases
    name: CHD case series of PMID:18535492 and PMID:22349727
    description: >-
      63 individuals with congenital heart disease, listed in PMID:34324492's
      S2 Table as one source of its CNV case set and cited there under both
      PMIDs; S2 gives the platform as CGH array.
  # Rewritten 2026-10-26. It published a curator's instruction ("and the page
  # must say so"), credited the study with a scope judgement it does not make,
  # and gave a row's case set as 7,958 beside rows that count fewer. Each clause
  # now measured: the abstract quote against PubMed's text; S2 Table (this
  # series: 777; total 7,958) in the study's supplement; every one of the 121
  # mirror rows citing this cohort is a deletion row; S8 Table holds only the
  # 528 significant genes; chd_scope.yaml has no "aneurysm" term (its "aort"
  # matches are aortic valve terms and supravalvular aortic stenosis, both
  # congenital).
  #
  # The last sentence's denominator changed later the same day. It named the
  # 7,107 cases in S1 Table's deletion column, which counts the cohort as
  # assembled; the article's methods put the permutation test on the 6,746
  # cases and 14,024 controls that remained after filtering, the rows now
  # publish those, and the sentence names them (see `DENOMINATORS` in
  # scripts/convert_audain2021.py). It still names no count of the 777 within
  # that set, because nothing read in the study gives one.
  - id: taa_cases
    name: Sporadic thoracic aortic aneurysm case series (PMID 21092924)
    description: >-
      777 individuals with sporadic thoracic aortic aneurysm, included in the
      CNV case set of PMID:34324492 alongside the CHD cases; the study's
      abstract describes its probands as "probands with CHD including cases
      with sporadic thoracic aortic aneurysm". Thoracic aortic aneurysm is
      outside this atlas's scope, which lists no aortic aneurysm, and whether
      any of these probands also has a congenital heart lesion is not recorded
      here. The study's S8 table reports the CHD-only contribution separately,
      for the 528 genes that reached significance. The study puts this series
      at 777 of its 7,958 cases; a row naming this cohort is computed on the
      6,746 cases and 14,024 controls that remained after the study's
      filtering, as its methods state.
  - id: gain_controls
    name: Genetic Association Information Network (GAIN) controls
    description: >-
      7,993 population controls genotyped on Illumina and CGH arrays, the
      largest control contributor to PMID:34324492. Not screened for
      congenital heart disease, so a control carrying an undiagnosed lesion is
      counted as a control.
    url: https://fnih.org/what-we-do/major-completed-programs/genetic-association-information-network
  - id: wtccc_controls
    name: Wellcome Trust Case Control Consortium controls
    description: >-
      4,385 UK population controls. Not screened for congenital heart disease.
  - id: ottawa_controls
    name: Ottawa Heart Institute controls
    description: >-
      1,704 controls from the Ottawa Heart Institute series. Not screened for
      congenital heart disease.
  # FOR A CURATOR, and kept out of the description because a reader does not
  # need it (rewritten 2026-10-26: the description published this instruction
  # on methods.html, in cohorts.json and in every gene page's cohort fold that
  # cites PCGC). Curating any of the earlier PCGC exome papers -- Jin et al.
  # 2017 (PMID:28991257) among them -- alongside PMID:40127276 would publish the
  # same probands twice under two study ids, which is the double counting D33
  # forbids -- and it would be invisible to `shared_cohorts`, because the
  # overlap is inside one study's cohort list rather than between two. Meet the
  # constraint before writing the row, not after.
  - id: pcgc
    name: Pediatric Cardiac Genomics Consortium (CHD GENES)
    description: >-
      11,555 CHD probands and 7,774 parents -- 3,887 complete trios and 7,668
      singletons -- recruited to the Congenital Heart Disease Network Study of
      the Pediatric Cardiac Genomics Consortium (ClinicalTrials.gov
      NCT01196182) across thirteen centres in the US and UK, and the case set of
      PMID:40127276. THIS COLLECTION SUBSUMES THE COHORTS OF THE EARLIER PCGC
      EXOME PAPERS, including Jin et al. 2017 (PMID:28991257), whose ~2,871
      trios are a subset of these 3,887, so results from those papers are not
      independent of PMID:40127276's.
    url: https://benchtobassinet.com/
  # Reworded 2026-10-26 so it cannot expire. It gave the maximum denominator as
  # 271,354 and the count above twice 133,743 as "22 of the 90 rows mirrored
  # here", both written before the mirror widened and both false after it:
  # measured that day, 123 PMID:40127276 rows cite this collection, all
  # counting alleles, 36 of them above 267,486, the largest 271,396 -- which
  # RAF1's page printed beside the old sentence. `test_models_cohort.py` holds
  # "some exceed twice that figure" to the mirror, reading the figure from this
  # description.
  - id: gnomad_controls
    name: gnomAD exomes and genomes, excluding TopMed
    description: >-
      The gnomAD population reference, restricted by PMID:40127276 to samples
      with exome or genome sequence and not also present in TopMed. The study
      states this control set as 133,743 samples; the per-gene control
      denominators it publishes are ALLELE counts, and some exceed twice that
      figure. The two are not reconcilable from what the paper reports, so the
      atlas republishes both and asserts neither -- treat the row's own denominator as
      the one its statistic was computed from. THREE FURTHER CAVEATS QUALIFY
      EVERY STATISTIC COMPUTED AGAINST IT. It is a population reference rather
      than a screened control group -- gnomAD excludes individuals with severe
      paediatric disease at the cohort level but does not ascertain heart
      phenotypes, so an adult with an undiagnosed lesion counts as a control.
      Allele denominators vary gene by gene with sequencing coverage, and a
      control carrying two qualifying variants is counted twice. And no parental
      or sample-level data were available to the study, so the control side has
      no transmission information to match the case side's.
    url: https://gnomad.broadinstitute.org/
  - id: ukbb
    name: UK Biobank (whole-exome sequencing)
    description: >-
      Population cohort of ~500,000 UK adults recruited at ages 40-69, used as the
      control set in PMID:42230622 under approved application 44165. Participants
      labelled with schizophrenia, bipolar disorder, developmental delay or other
      congenital anomalies were excluded from that analysis. TWO CAVEATS QUALIFY
      EVERY ODDS RATIO COMPUTED AGAINST IT, both stated by the study itself: the
      controls are adults while a substantial proportion of the CHD cases were
      enrolled in childhood, so rare variants causing severe CHD may be
      under-represented among controls through survivorship; and the combined
      cohort is ~92% European ancestry, which limits how far its allele-frequency
      estimates generalise.
    url: https://www.ukbiobank.ac.uk/
